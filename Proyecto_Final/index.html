      </div>
      <div class="card-body">
        <h5 class="card-title">Flappy Bird usando TypeScript basado en Franks laboratory</h5>
        <p class="card-text">presiona espacio para volar</p>

   
        <button
          id="restartBtn"
          class="btn btn-danger me-2"

        <label for="levelSelect" class="form-label">Selecciona Nivel:</label>
        <select
          id="levelSelect"
          class="form-select"
          style="width: 150px; display: inline-block;"
        >
          <option value="2" selected>Nivel 2 (normal)</option>
          <option value="1">Nivel 1 (lento)</option>

        </select>
