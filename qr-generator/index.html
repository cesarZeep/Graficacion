<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generador QR</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" 
        rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="./style/index.css" />

    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      body {
        min-height: 100vh;
      }
      main {
        flex: 1 0 auto;
        padding-top: 70px; /* navbar fixed */
        padding-bottom: 60px; /* footer */
        max-width: 450px;
        margin: 0 auto;
        width: 100%;
      }
      footer#footer {
        flex-shrink: 0;
        background: linear-gradient(0deg,#1c3643,#273b47 25%,#1e5372);
        color: white;
        padding: 1rem 0;
        text-align: center;
      }
      footer#footer a {
        color: #FFFFFF;
        text-decoration: none;
        margin: 0 10px;
      }
      footer#footer a:hover {
        text-decoration: underline;
      }

      .btn-quick {
        margin: 0 4px 8px 0;
      }
      #qr-canvas {
        border: 1px solid #ddd;
        background: white;
        margin: 10px 0;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Graficación</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Abrir</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Visualizar</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Expand</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button"
                data-bs-toggle="dropdown" aria-expanded="false">About</a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                <li><a class="dropdown-item" href="#">Development Team</a></li>
                <li><a class="dropdown-item" href="#">Version</a></li>
                <li><a class="dropdown-item" href="#">Contact</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <h1 class="text-center mb-4">Generador de Códigos QR</h1>
      
      <div class="mb-3 d-flex">
        <input type="text" id="qr-input" class="form-control me-2" placeholder="Ingresa URL o texto" />
        <button id="generate-btn" class="btn btn-primary">Generar</button>
      </div>

      <div class="mb-3">
        <button class="btn btn-secondary btn-quick" data-url="https://youtube.com">YouTube</button>
        <button class="btn btn-secondary btn-quick" data-url="https://github.com">GitHub</button>
        <button class="btn btn-secondary btn-quick" data-url="https://uabjo.mx">UABJO</button>
      </div>

      <canvas id="qr-canvas" width="300" height="300"></canvas>

      <button id="save-btn" class="btn btn-success mt-3 w-100">Guardar QR como imagen</button>
    </main>

    <footer id="footer">
      <div class="container">
        <div class="row text-center">
          <div class="col-12 col-lg">
            <a href="https://github.com/jorrgeCruz/graphics" target="_blank" rel="noopener">Repositorio Principal</a>
          </div>
          <div class="col-12 col-lg">
            <a href="#">Contáctanos</a>
          </div>
          <div class="col-12 col-lg">
            <a href="#">Estudiantes</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>
    <script src="./dist/src/index.js" type="module"></script>
  </body>
</html>
