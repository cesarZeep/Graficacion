<!doctype html>
<html class="no-js" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gráfico de Barras 3D Interactivo</title>
    <!-- Compressed CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
    <style>
      .controls {
        padding: 20px;
        background: #f8f9fa;
        border-radius: 8px;
        margin-top: 20px;
      }
      .control-group {
        margin-bottom: 15px;
      }
      .slider {
        width: 100%;
      }
      .color-picker {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .color-option {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #ddd;
      }
      .color-option:hover {
        border-color: #999;
      }
      .chart-container {
        margin: 20px auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Graficación</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" id="reset-btn">Reiniciar</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Opciones
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                <li><a class="dropdown-item" href="#" id="toggle-3d">Alternar 3D</a></li>
                <li><a class="dropdown-item" href="#" id="animate-btn">Animación</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="card">
        <div class="card-header text-center">
          <h4>Gráfico Interactivo 3D</h4>
        </div>
        <div class="chart-container">
          <canvas id="circlechart" width="800" height="500"></canvas>
        </div>
        <div class="card-body">
          <div class="controls">
            <div class="row">
              <div class="col-md-3">
                <div class="control-group">
                  <label class="form-label">Barra Azul (73%)</label>
                  <input type="range" min="0" max="100" value="73" class="form-range slider" data-bar="0" id="slider-blue">
                  <div class="color-picker">
                    <div class="color-option" style="background-color: #3498db;" data-color="#3498db" data-bar="0"></div>
                    <div class="color-option" style="background-color: #2980b9;" data-color="#2980b9" data-bar="0"></div>
                    <div class="color-option" style="background-color: #1f618d;" data-color="#1f618d" data-bar="0"></div>
                  </div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="control-group">
                  <label class="form-label">Barra Verde(61%)</label>
                  <input type="range" min="0" max="100" value="61" class="form-range slider" data-bar="1" id="slider-green">
                  <div class="color-picker">
                    <div class="color-option" style="background-color: #2ecc71;" data-color="#2ecc71" data-bar="1"></div>
                    <div class="color-option" style="background-color: #27ae60;" data-color="#27ae60" data-bar="1"></div>
                    <div class="color-option" style="background-color: #219653;" data-color="#219653" data-bar="1"></div>
                  </div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="control-group">
                  <label class="form-label">Barra Rosa (53%)</label>
                  <input type="range" min="0" max="100" value="53" class="form-range slider" data-bar="2" id="slider-pink">
                  <div class="color-picker">
                    <div class="color-option" style="background-color: #e91e63;" data-color="#e91e63" data-bar="2"></div>
                    <div class="color-option" style="background-color: #c2185b;" data-color="#c2185b" data-bar="2"></div>
                    <div class="color-option" style="background-color: #ad1457;" data-color="#ad1457" data-bar="2"></div>
                  </div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="control-group">
                  <label class="form-label">Barra Naranja (52%)</label>
                  <input type="range" min="0" max="100" value="52" class="form-range slider" data-bar="3" id="slider-orange">
                  <div class="color-picker">
                    <div class="color-option" style="background-color: #f39c12;" data-color="#f39c12" data-bar="3"></div>
                    <div class="color-option" style="background-color: #e67e22;" data-color="#e67e22" data-bar="3"></div>
                    <div class="color-option" style="background-color: #d35400;" data-color="#d35400" data-bar="3"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer text-muted text-center">
          Gráfico interactivo con controles deslizantes y selector de colores tambien en el menu de opciones puedes elegir ver las barras en 2D.
        </div>
      </div>
    </div>

    <footer id="footer" class="pb-4 pt-4 mt-4">
      <div class="container">
        <div class="row text-center">
          <div class="col-12 col-lg">
            <a href="https://github.com/jorrgeCruz/graphics">Repositorio Principal</a>
          </div>
          <div class="col-12 col-lg">
            <a href="#">Contáctanos</a>
          </div>
          <div class="col-12 col-lg">
            <a href="#">Estudiantes</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Compressed JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" 
      integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <script src="./dist/src/index.js" type="module"></script>
  </body>
</html>
